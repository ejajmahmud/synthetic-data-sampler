[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-data-sampler"
version = "0.1.0"
description = "Schema-driven synthetic test data generator with differential privacy noise injection for AI agent testing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
synthetic-data-sampler = "synthetic_data_sampler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthetic_data_sampler*"]
